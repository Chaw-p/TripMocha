<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<!-- Flask에서 에러 메시지를 전달받으면 data-toast 속성으로 넣음 -->
<body data-toast="{{ error if error }}">

    <div class="login-container">
        <img src="{{ url_for('static', filename='img/logo.png') }}" 
             alt="TripMocha 로고" 
             class="tripmocha-logo"> 

        <main class="login-box">
            
            <!-- 브라우저 기본 경고 막기 위해 novalidate 추가 -->
            <form action="/login" method="post" novalidate>
                
                <div class="input-group">
                    <input type="text" name="user_id" placeholder="아이디" required>
                </div>

                <div class="input-group">
                    <input type="password" name="password" placeholder="비밀번호" required>
                </div>
                
                <button type="submit" class="login-btn">
                    로그인
                </button>
            </form>

            <div class="find-links">
                <a href="{{ url_for('login_bp.find_password') }}">비밀번호 찾기</a>
                <span>|</span>
                <a href="{{ url_for('login_bp.find_id_page') }}">아이디 찾기</a>
                <span>|</span>
                <a href="{{ url_for('login_bp.join_page') }}" class="signup-link">회원가입</a>
            </div>
        </main>
    </div>

    <!-- 토스트 메시지 박스 -->
    <div id="toast" class="toast hidden"></div>

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
